name: ORBIT CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install ruff black
      - name: Run Ruff
        run: ruff check .
      - name: Run Black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest tests/ -v --cov=orbit --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Start services
        run: docker-compose up -d redis
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
      - name: Run integration tests
        run: poetry run pytest tests/integration/ -v
      - name: Stop services
        run: docker-compose down

  eval:
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
      - name: Run evaluation benchmark
        run: |
          poetry run python -m orbit.evaluation.run_benchmark
          # Block if F1 < 0.82 or latency p99 > 60ms
          F1=$(cat eval_results/f1_score.txt)
          LATENCY=$(cat eval_results/latency_p99.txt)
          if (( $(echo "$F1 < 0.82" | bc -l) )); then
            echo "F1 score $F1 below threshold 0.82. Blocking merge."
            exit 1
          fi
          if (( $(echo "$LATENCY > 60" | bc -l) )); then
            echo "Latency p99 $LATENCY above threshold 60ms. Blocking merge."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, integration, eval]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -f docker/Dockerfile.api .
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
